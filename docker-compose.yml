# LetsFG — Docker Compose
#
# Usage (one-off commands):
#   docker compose run --rm letsfg search LON BCN 2026-06-01
#   docker compose run --rm letsfg search LHR JFK 2026-06-01 --return 2026-06-08 --adults 2 --json
#   docker compose run --rm letsfg locations "New York"
#
# Credentials come from the environment (or a .env file, which is gitignored):
#   LETSFG_BEARER_TOKEN=eyJ...    card-backed PFS token: free search, and booking
#   LETSFG_API_KEY=letsfg_...     paid Developer API lane
#
# Book off a search:
#   docker compose run --rm letsfg book ws_off_xxx --search-id ws_abc \
#     --passenger '{"given_name":"Ada","family_name":"Lovelace","born_on":"1990-04-01","gender":"f"}' \
#     --email you@example.com
#
# Build the image:
#   docker compose build

services:
  letsfg:
    build:
      context: .
      dockerfile: Dockerfile.python
    environment:
      # Card-backed PFS token — search and booking on the free lane
      LETSFG_BEARER_TOKEN: ${LETSFG_BEARER_TOKEN:-}
      # Optional — paid Developer API key
      LETSFG_API_KEY: ${LETSFG_API_KEY:-}
    # Containers are short-lived CLI invocations — remove on exit
    # Use `docker compose run --rm letsfg <command>`
