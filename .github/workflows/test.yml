name: CI Tests (Tier-1 gate)

# Tier-1 deterministic merge gate.
# Required status checks: python-deterministic, typescript-packages.
# Enable both in Settings → Branches → main → required status checks.
# python-deterministic runs the offline suite; network tests are marked
# @pytest.mark.live and excluded here — run them on demand with `pytest -m live`
# (docs/TESTING.md).
# typescript-packages type-checks the JS SDK and MCP server.
# docs-claims runs the two zero-dependency guards: documented claims + workflow hygiene.
# regression-test-gate requires a test change from any PR that reads as a fix
# (title or commit subject says fix/hotfix/bugfix); bypass with the
# `skip-regression-test` label.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-packages:
    name: TypeScript packages (Tier-1, required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [sdk/js, sdk/mcp]
    steps:
      # The token is only needed for this checkout; nothing later pushes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: ${{ matrix.package }}
      - name: Run tests
        if: hashFiles(format('{0}/src/**/*.test.ts', matrix.package)) != ''
        run: npm test
        working-directory: ${{ matrix.package }}

  docs-claims:
    name: Docs claims & links (Tier-1, required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '20'
      # Zero dependencies on purpose: this must run even if a package install
      # breaks. It pins versions, the documented MCP tool list, the OpenAPI
      # server+path composition, and local markdown links.
      - name: Docs claims and local links
        run: node --test test/docs-claims.test.mjs
      - name: Workflow hygiene (timeouts, permissions, pins, concurrency)
        run: node --test test/workflow-hygiene.test.mjs

  test-coverage-gate:
    name: Test coverage gate (new source files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-test-gate')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check new source files have tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Watched paths: SDK source files (exclude test files and built output)
          WATCH_PATHS="sdk/js/src sdk/mcp/src"

          # Get files Added (A) or Renamed (R) in this PR vs base branch
          NEW_FILES=$(git diff --name-only --diff-filter=AR "origin/$BASE_REF"...HEAD | \
            grep -E '\.(ts|tsx)$' | \
            grep -v '\.test\.(ts|tsx)$' | \
            grep -v '\.d\.ts$' || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new source files — gate passes."
            exit 0
          fi

          MISSING=()
          for file in $NEW_FILES; do
            # Only check files under watched paths
            in_watch=false
            for path in $WATCH_PATHS; do
              if [[ "$file" == "$path/"* ]]; then
                in_watch=true
                break
              fi
            done
            [ "$in_watch" = true ] || continue

            # Check sibling .test.ts or __tests__/<name>.test.ts
            dir=$(dirname "$file")
            base=$(basename "$file" .ts)
            base=${base%.tsx}
            sibling_test="$dir/$base.test.ts"
            subdir_test="$dir/__tests__/$base.test.ts"

            if [ ! -f "$sibling_test" ] && [ ! -f "$subdir_test" ]; then
              MISSING+=("$file → expected $sibling_test")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "❌ Test coverage gate failed — new source files have no corresponding test:"
            for m in "${MISSING[@]}"; do
              echo "  • $m"
            done
            echo ""
            echo "Add test files or label the PR with 'skip-test-gate' for exceptions (hotfixes, config-only)."
            exit 1
          fi

          echo "✓ All new source files have tests."

  regression-test-gate:
    name: Regression test gate (fix PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-regression-test')
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The trigger is the PR title or any commit subject; the requirement is a
      # changed *.test.ts in every package whose sdk/*/src changed. The logic
      # lives in a script so it can be reproduced locally:
      #   bash .github/scripts/check-regression-test.sh 'fix: x' <base-sha> <head-sha>
      - name: A fix PR must carry a test change
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-regression-test.sh

  python-deterministic:
    name: Python deterministic tests (Tier-1, required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Install package + pytest
        run: |
          pip install -e .
          pip install pytest
      - name: Deterministic tests (pytest -m "not live")
        run: pytest -m "not live"
